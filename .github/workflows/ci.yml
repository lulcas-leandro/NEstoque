name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
    validate:
        runs-on: ubuntu-latest

        env:
            SECRET_KEY: test-secret-key
            DATABASE_URL: 'sqlite:///:memory:'
            
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.11'
            
            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
                pip install pytest
            
            - name: Smoke tests
              run: pytest -v
            
            - name: Docker build
              run: docker build -t nestoque:ci .